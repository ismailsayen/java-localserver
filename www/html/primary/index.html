<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java-Localserver</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* VARIABLES (GLOBAL STYLE) */
        :root {
            --bg-color: #0f172a;
            --primary-color: #1e293b;
            --accent-color: #3b82f6;
            --text-color: #e2e8f0;
            --muted-text: #94a3b8;
            --radius: 12px;
        }

        /* BODY */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* CONTAINER */
        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            color: var(--muted-text);
        }

        /* CARD */
        .card {
            background: var(--primary-color);
            padding: 30px;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* BUTTON */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: var(--accent-color);
            color: white;
            border-radius: var(--radius);
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>Java-Localserver</h1>
        </div>

        <div class="card">
            <h1>Welcome to Our Server 👋</h1>
            <p>This is your starting page.</p>
            <a href="#" class="btn">Get Started</a>
        </div>

    </div>

</body>
</html>
